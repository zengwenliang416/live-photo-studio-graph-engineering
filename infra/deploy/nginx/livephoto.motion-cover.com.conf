server {
    listen 80;
    server_name livephoto.motion-cover.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name livephoto.motion-cover.com;

    ssl_certificate     /etc/nginx/ssl/livephoto.motion-cover.com.crt;
    ssl_certificate_key /etc/nginx/ssl/livephoto.motion-cover.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    auth_basic "Live Photo Studio Canary";
    auth_basic_user_file /etc/nginx/.htpasswd-livephoto;

    client_max_body_size 24m;

    location /v1/workflow-runs/ {
        proxy_pass http://127.0.0.1:4040;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:4040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
