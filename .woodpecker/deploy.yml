labels:
  location: production-80
  repo: zengwenliang416/live-photo-studio-graph-engineering

when:
  - event: push
    branch: main
  - event: manual

steps:
  deploy:
    image: docker:28-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/live-photo-studio:/opt/live-photo-studio
    commands:
      - apk add --no-cache curl
      - infra/deploy/deploy.sh "$CI_COMMIT_SHA"
