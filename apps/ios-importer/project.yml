name: LivePhotoImporter

options:
  bundleIdPrefix: com.motioncover
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

targets:
  LivePhotoImporter:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motioncover.livephoto.importer
        PRODUCT_MODULE_NAME: LivePhotoImporter
        INFOPLIST_KEY_CFBundleDisplayName: Motion Cover
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: false
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ""
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 将替换后的封面和原始动态视频保存为一张 Live Photo。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIRequiresFullScreen: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/LivePhotoImporter-Info.plist
      properties:
        CFBundleDisplayName: Motion Cover
        NSPhotoLibraryAddUsageDescription: 将替换后的封面和原始动态视频保存为一张 Live Photo。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Live Photo Studio Package
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.zip-archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.motioncover.live-photo-package
            UTTypeDescription: Live Photo Studio Package
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - zip
    scheme:
      testTargets:
        - LivePhotoImporterTests

  LivePhotoImporterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LivePhotoImporter
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motioncover.livephoto.importer.tests
        PRODUCT_MODULE_NAME: LivePhotoImporterTests
    info:
      path: Generated/LivePhotoImporterTests-Info.plist
